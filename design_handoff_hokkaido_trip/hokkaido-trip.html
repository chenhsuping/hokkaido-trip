<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>北海道小旅行 12/25 – 01/03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="./image-slot.js"></script>
<style>
  :root{
    --ink:#2b2721; --ink-2:#6a6055; --ink-3:#a99d8c;
    --paper:#fffefb; --bg:#fff2dc; --line:rgba(43,39,33,.12);
    --jr:#0e7ad4; --drive:#f4622e; --bus:#12a97a;
    --jr-soft:#dcefff; --drive-soft:#ffe4d6;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
       background-color:#fff4e2;
       background-image:linear-gradient(180deg,#fff8ec 0%,#fff2dc 55%,#ffeed3 100%);
       background-attachment:fixed;
       -webkit-font-smoothing:antialiased}
  a{color:var(--jr);text-decoration:none} a:hover{color:var(--ink)}
  .cap{font-size:10px;letter-spacing:.26em;color:var(--drive);text-transform:uppercase;font-weight:500}

  header{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:28px;
         padding:34px 40px 22px;max-width:1560px;margin:0 auto}
  h1 em{font-style:normal;position:relative;z-index:1}
  h1 em::after{content:"";position:absolute;left:-4px;right:-4px;bottom:2px;height:11px;z-index:-1;
               background:rgba(244,98,46,.28);border-radius:6px}
  h1{font-weight:700;font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-weight:700;font-size:34px;margin:8px 0 0;
     letter-spacing:.12em;line-height:1.15}
  .sub{font-size:12.5px;color:var(--ink-2);letter-spacing:.1em;margin-top:12px}
  .sub b{font-weight:500;color:var(--ink)}
  .legend{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);align-items:center}
  .legend span{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;
               background:var(--paper);border:1.5px solid var(--line);letter-spacing:.08em;font-weight:500}
  .legend i{width:22px;height:0;border-top:2.5px solid var(--jr);border-radius:2px}
  .legend i.drive{border-top-style:dashed;border-color:var(--drive)}

  .top{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:0 40px;
       height:min(660px,72vh);max-width:1560px;margin:0 auto}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;
         box-shadow:0 1px 1px rgba(23,34,43,.03),0 26px 46px -34px rgba(23,34,43,.5)}
  .days{overflow-y:auto;overflow-x:hidden;padding:14px 12px}
  .days::-webkit-scrollbar{width:5px}
  .days::-webkit-scrollbar-thumb{background:#ddd5c7;border-radius:3px}
  .day{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
       padding:12px 14px 12px 26px;cursor:pointer;border-radius:12px;transition:background .2s}
  .day::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:var(--line)}
  .day:first-child::before{top:50%} .day:last-child::before{bottom:50%}
  .day::after{content:"";position:absolute;left:9.5px;top:50%;width:6px;height:6px;margin-top:-3px;
              border-radius:50%;background:#d8d0c1;transition:.2s}
  .day:hover{background:#f7f1e4}
  .day.on{background:var(--jr-soft)}
  .day.drive.on{background:var(--drive-soft)}
  .day.on::after{background:var(--jr);box-shadow:0 0 0 3px rgba(14,122,212,.22)}
  .day.drive.on::after{background:var(--drive);box-shadow:0 0 0 3px rgba(244,98,46,.26)}
  .day .n{font-size:9.5px;color:var(--ink-3);letter-spacing:.24em}
  .day .d{font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-size:18px;font-weight:700;letter-spacing:.03em}
  .day .w{font-size:11px;color:var(--ink-3);margin-left:5px}
  .day .city{font-size:11.5px;color:var(--ink-2);margin-top:4px;letter-spacing:.03em}
  .day .mode{width:52px;height:36px;display:grid;place-items:center;
             background:none;color:var(--ink-3);opacity:.55;transition:.2s}
  .day.on .mode{opacity:1}
  .day:hover .mode{opacity:.85}

  .mapwrap{position:relative;overflow:hidden;border-radius:22px;background:#e7e3d6;
           box-shadow:0 1px 1px rgba(23,34,43,.05),0 30px 60px -38px rgba(11,19,26,.55)}
  #map{width:100%;height:100%}
  .leaflet-tile-pane{filter:grayscale(.62) sepia(.16) brightness(1.08) contrast(.9) saturate(.95)}
  .leaflet-container{background:#dfe4dc;font-family:"Noto Sans TC",sans-serif}
  .leaflet-control-attribution{font-size:9.5px;background:rgba(255,255,255,.72)}
  .leaflet-bar a{border-radius:6px}
  .mapfade{position:absolute;inset:0;z-index:480;pointer-events:none;background:#1b2530;
           opacity:0;transition:opacity 1.1s ease}
  .mapfade.on{opacity:.72}
  .legnow{position:absolute;left:18px;top:18px;z-index:500;pointer-events:none;
          background:rgba(255,253,251,.94);border:1px solid var(--line);border-radius:12px;
          padding:10px 16px;max-width:min(420px,52%);box-shadow:0 14px 30px -22px rgba(36,31,26,.8)}
  .legnow .cap{margin-bottom:5px}
  .legnow .t{font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-size:14px;letter-spacing:.04em;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .maphint{position:absolute;left:18px;bottom:20px;z-index:500;pointer-events:none;
           color:var(--ink-3);font-size:10px;letter-spacing:.12em;
           background:rgba(255,253,251,.8);padding:4px 9px;border-radius:8px}

  .pin{position:relative}
  .pin .dot{position:absolute;left:-5.5px;top:-5.5px;width:11px;height:11px;border-radius:50%;
            background:var(--jr);border:2px solid #fff;box-shadow:0 0 0 4px rgba(14,122,212,.2)}
  .pin.drive .dot{background:var(--drive);box-shadow:0 0 0 4px rgba(244,98,46,.24)}
  .pin.far .labels{left:56px}
  .pin.far.flip .labels{left:auto;right:56px}
  .pin .labels{position:absolute;left:12px;top:50%;transform:translateY(-50%);
               display:flex;flex-direction:column;gap:3px;white-space:nowrap}
  .pin.flip .labels{left:auto;right:12px;align-items:flex-end}
  .pin .labels b{font-weight:500;font-size:12px;border-radius:99px !important;letter-spacing:.03em;color:var(--ink);
                 background:rgba(255,253,251,.92);border:1px solid var(--line);
                 border-radius:7px;padding:3px 8px;
                 box-shadow:0 6px 14px -10px rgba(23,34,43,.9)}
  .pin .labels b i{font-style:normal;color:var(--jr);margin-right:6px;font-variant-numeric:tabular-nums}
  .pin.drive .labels b i{color:var(--drive)}
  .veh{width:80px;height:52px;margin:-26px 0 0 -40px;display:grid;place-items:center}
  .veh .core{display:grid;place-items:center;transition:transform .5s cubic-bezier(.4,0,.2,1);
             filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 2px rgba(255,255,255,.95))
                    drop-shadow(0 3px 5px rgba(43,39,33,.35))}
  .spotpop{position:absolute;left:16px;top:16px;width:180px;background:var(--paper);
           border:1px solid var(--line);border-radius:14px;overflow:hidden;
           box-shadow:0 18px 34px -22px rgba(43,39,33,.9);
           animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
  .spotpop.flip{left:auto;right:16px}
  .spotpop .ph{width:100%;height:96px;background-size:cover;background-position:center}
  .spotpop .tx{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px}
  .spotpop b{font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-size:12.5px;font-weight:700}
  .spotpop span{font-size:10.5px;color:var(--ink-3);letter-spacing:.03em}
  .spotpop.out{animation:popout .24s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes popout{to{opacity:0;transform:translateY(-4px) scale(.97)}}
  .pin .labels b.stay{background:#7a5cc4;color:#fff;border-color:#7a5cc4}
  .pin .labels b.stay i{color:#e4dcfa}
  .xfer{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fdfaf4;
        border:2px solid #5c5348;box-shadow:0 4px 10px -6px rgba(23,34,43,.8)}

  .bottom{padding:34px 40px 60px;max-width:1560px;margin:0 auto}
  .bhead{display:flex;align-items:baseline;gap:16px;margin-bottom:20px;flex-wrap:wrap;
         padding-bottom:14px;border-bottom:2px dashed rgba(43,39,33,.16)}
  .bhead h2{font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-size:20px;margin:0;font-weight:700;letter-spacing:.05em}
  .bhead .meta{font-size:12px;color:var(--ink-3);letter-spacing:.05em}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:22px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;
        display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;
        box-shadow:0 1px 1px rgba(23,34,43,.03),0 20px 34px -32px rgba(23,34,43,.6)}
  .card:hover{transform:translateY(-3px)}
  .card.active{border-color:var(--jr);box-shadow:0 0 0 2px var(--jr-soft),0 20px 34px -26px rgba(43,39,33,.6)}
  .card.drive.active{border-color:var(--drive);box-shadow:0 0 0 2px var(--drive-soft),0 20px 34px -26px rgba(43,39,33,.6)}
  .card .img{position:relative;width:100%;aspect-ratio:4/3;background:#f4ece0;
             border-bottom:1px dashed rgba(43,39,33,.16)}
  .card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:7px}
  .card .tag{align-self:flex-start;font-size:11px;font-weight:500;letter-spacing:.08em;
             color:#fff;background:var(--jr);border-radius:99px;padding:3px 11px}
  .card.drive .tag{background:var(--drive)}
  .card .tag.stayc{background:#7a5cc4}
  .card h3{font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-size:16.5px;margin:0;font-weight:700;letter-spacing:.03em}
  .kana{font-size:10.5px;color:var(--ink-3);letter-spacing:.1em}
  .card .credit{font-size:10px;color:var(--ink-3);letter-spacing:.04em;margin-top:2px}
  .card .credit a{color:var(--ink-3);text-decoration:underline}
  .card .credit a:hover{color:var(--jr)}
  .card p{margin:4px 0 0;font-size:12.5px;line-height:1.85;color:var(--ink-2);text-wrap:pretty}
  @media (max-width:1080px){
    header{padding:26px 24px 16px}
    h1{font-size:28px}
    .top{grid-template-columns:250px 1fr;gap:14px;padding:0 24px;height:min(560px,66vh)}
    .bottom{padding:26px 24px 48px}
  }
  @media (max-width:820px){
    header{flex-direction:column;align-items:flex-start;gap:14px;padding:22px 18px 14px}
    h1{font-size:25px;letter-spacing:.08em}
    .sub{font-size:11.5px;margin-top:9px}
    .legend{gap:8px;flex-wrap:wrap}
    .top{display:flex;flex-direction:column;gap:12px;padding:0 18px;height:auto}
    .days{display:flex;flex-direction:row;gap:8px;overflow-x:auto;overflow-y:hidden;
          padding:10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .days::-webkit-scrollbar{height:5px}
    .day{flex:0 0 auto;min-width:132px;grid-template-columns:1fr;justify-items:flex-start;
         padding:10px 14px;scroll-snap-align:start}
    .day::before,.day::after{display:none}
    .day .mode{width:44px;height:28px;margin-top:6px}
    .mapwrap{height:52vh;min-height:320px}
    .legnow{left:12px;top:12px;padding:8px 12px;max-width:min(320px,66%);border-radius:10px}
    .legnow .t{font-size:12.5px}
    .maphint{display:none}
    .pin .labels b{font-size:11px;padding:2px 7px}
    .bottom{padding:22px 18px 44px}
    .bhead h2{font-size:17px}
    .cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  }
  @media (max-width:560px){
    h1{font-size:23px}
    .sub{letter-spacing:.06em}
    .mapwrap{height:46vh;min-height:280px}
    .veh{transform:scale(.8)}
    .cards{grid-template-columns:1fr;gap:14px}
    .card .img{aspect-ratio:16/10}
    .card .body{padding:14px 15px 17px}
    .bhead{gap:8px}
    .bhead .meta{font-size:11.5px}
  }
</style>
</head>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <circle cx="100" cy="86" r="34" fill="#fff8ec"/>
  <rect x="66" y="120" width="68" height="10" rx="5" fill="#fff8ec" opacity=".85"/>

</svg>

<header>
  <div>
    <div class="cap">Hokkaido · Winter Itinerary</div>
    <h1><em>北海道</em>小旅行</h1>
    <div class="sub"><b>2025.12.25 — 12.31</b>　旭川 · 小樽 · 洞爺 · 函館 · 札幌（01/01–01/03 待規劃）</div>
  </div>
  <div class="legend">
    <span><i></i>JR 鐵路</span>
    <span><i class="drive"></i>租車自駕</span>
    <span><i style="width:10px;height:10px;border:0;border-radius:4px;background:#7a5cc4"></i>當晚住宿</span>
  </div>
</header>

<div class="top">
  <div class="panel days" id="days"></div>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legnow"><div class="cap" id="legday">Day 1</div><div class="t" id="legtext"></div></div>
    <div class="mapfade" id="mapfade"></div>
    <div class="maphint">點選左側日期 · 圖示依當日路線（含轉車）移動</div>
  </div>
</div>

<div class="bottom">
  <div class="bhead"><h2 id="btitle"></h2><div class="meta" id="bmeta"></div></div>
  <div class="cards" id="cards"></div>
</div>

<script>
const P = {
  chitose:[141.6920,42.7750], sapporo:[141.3507,43.0686], asahikawa:[142.36473,43.76075],
  hotelAsahikawa:[142.36170,43.75940], heiwa:[142.36280,43.76860], hachiya:[142.36400,43.77000],
  busTerm:[142.36520,43.76040], zoo:[142.47978,43.76803],
  otaru:[140.99386,43.19756], nord:[141.00060,43.19840], sankaku:[140.99320,43.19770],
  toyaStn:[140.77630,42.56610], toyaHotel:[140.81778,42.56417],
  showa:[140.86444,42.54250], yunokawaZoo:[140.79480,41.78030], yukura:[140.79100,41.78211],
  hakodateStn:[140.72640,41.77370], jujigai:[140.71632,41.76496], kanemori:[140.71645,41.76618],
  komeda:[140.7180,41.7690], hachiman:[140.7110,41.7620], yamazaki:[140.7150,41.7640],
  ropeway:[140.7080,41.7590], gotoken:[140.7160,41.7640],
  goryokaku:[140.75696,41.79690], daikokuya:[140.75980,41.79600], asaichi:[140.72538,41.77256],
  susukino:[141.3540,43.0540], odori:[140.0,0], tokeidai:[141.35361,43.06250],
  akarenga:[141.34800,43.06394], ichiryuan:[141.35600,43.06800]
};
P.odori = [141.35643,43.06109];

const DAYS = [
  { d:"12/25", w:"四", city:"新千歲 → 旭川", note:"11:30 抵達新千歲，札幌轉車，15:00 到旭川",
    legs:[
      {from:P.chitose, to:P.sapporo, mode:"jr", label:"Rapid Airport ／ 新千歲空港 → JR 札幌站　40 min"},
      {from:P.sapporo, to:P.asahikawa, mode:"jr", label:"轉車 · JR 特急 Kamui / Lilac ／ 札幌 → 旭川　90 min"},
      {from:P.asahikawa, to:P.hotelAsahikawa, mode:"walk", label:"步行 2 min ／ 旭川 JR 酒店 Check-in"},
      {from:P.hotelAsahikawa, to:P.heiwa, mode:"walk", label:"步行 10 min ／ 平和通商店街"},
      {from:P.heiwa, to:P.hachiya, mode:"walk", label:"步行 5 min ／ 蜂屋 五条創業店"},
      {from:P.hachiya, to:P.hotelAsahikawa, mode:"walk", label:"步行 ／ 返回 旭川 JR 酒店"}
    ],
    spots:[
      {n:"新千歲空港", time:"11:30", act:"抵達北海道", p:P.chitose,
       d:"台灣虎航 IT234 抵達，出關後搭 Rapid Airport 進札幌，於 JR 札幌站轉特急北上旭川。"},
      {n:"旭川 JR 酒店", time:"15:00", act:"飯店 Check-in、寄放行李", p:P.hotelAsahikawa, stay:true,
       d:"JR 旭川站旁的飯店，出站步行 2 分鐘，先寄放行李再出門逛商店街。"},
      {n:"平和通商店街", time:"15:30", act:"走走逛逛", p:P.heiwa,
       d:"從旭川 JR 酒店步行 10 分鐘，日本第一條行人徒步商店街，冬天兩側積雪、燈飾亮起。"},
      {n:"蜂屋 五条創業店", time:"18:00", act:"醬油拉麵 晚餐", p:P.hachiya,
       d:"旭川拉麵的創業老店，焦香豬油的醬油湯頭配捲麵，離商店街步行 5 分鐘。"}
    ]},
  { d:"12/26", w:"五", city:"旭川 → 小樽", note:"上午旭山動物園，15:30 出發，經札幌轉車到小樽",
    legs:[
      {from:P.hotelAsahikawa, to:P.busTerm, mode:"walk", label:"步行 5 min ／ 旭川巴士總站 6 號月台"},
      {from:P.busTerm, to:P.zoo, mode:"bus", label:"41 號巴士 ／ 巴士總站 → 旭山動物園　50 min"},
      {from:P.zoo, to:P.asahikawa, mode:"bus", label:"41 號巴士 ／ 動物園 → JR 旭川站　40 min"},
      {from:P.asahikawa, to:P.sapporo, mode:"jr", label:"JR 特急 Kamui / Lilac ／ 旭川 → 札幌　90 min"},
      {from:P.sapporo, to:P.otaru, mode:"jr", label:"轉車 · 函館本線快速 ／ 札幌 → 小樽　40 min"},
      {from:P.otaru, to:P.nord, mode:"walk", label:"步行 10 min ／ Nord 小樽飯店 Check-in"}
    ],
    spots:[
      {n:"旭山動物園", time:"09:30", act:"企鵝走路、北極熊、海豹", p:P.zoo,
       d:"09:30 入園待到 14:30。冬季限定的企鵝散步、北極熊與北極狼、北極狐都在同一動線上。"},
      {n:"Nord 小樽飯店", time:"18:10", act:"Check-in、晚餐", p:P.nord,
       d:"18:00 抵達小樽，飯店在運河附近步行 10 分鐘；晚餐尚未指定。"}
    ]},
  { d:"12/27", w:"六", city:"小樽 → 洞爺", note:"三角市場午餐，13:00 出發，經札幌轉特急北斗到洞爺",
    legs:[
      {from:P.nord, to:P.sankaku, mode:"walk", label:"步行 10 min ／ 三角市場"},
      {from:P.sankaku, to:P.otaru, mode:"walk", label:"步行 ／ JR 小樽站"},
      {from:P.otaru, to:P.sapporo, mode:"jr", label:"函館本線快速 ／ 小樽 → 札幌　40 min"},
      {from:P.sapporo, to:P.toyaStn, mode:"jr", label:"轉車 · JR 特急 Hokuto ／ 札幌 → 洞爺　110 min"},
      {from:P.toyaStn, to:P.toyaHotel, mode:"bus", label:"飯店接駁車 15 min ／ 洞爺觀光酒店"}
    ],
    spots:[

const KEY = new Map();
Object.entries(P).forEach(([k,v])=>KEY.set(v[0]+','+v[1], k));
function viaFor(a,b){
  const k = KEY.get(a[0]+','+a[1]) + '>' + KEY.get(b[0]+','+b[1]);
  return VIA[k] || null;
}
/* Catmull-Rom 平滑：讓折線貼近實際路線又不生硬 */
function smooth(list){
  const pts = list.map(p=>L.latLng(p[1],p[0]));
  if(pts.length===2){
    const out=[]; for(let i=0;i<=24;i++){const t=i/24;
      out.push(L.latLng(pts[0].lat+(pts[1].lat-pts[0].lat)*t, pts[0].lng+(pts[1].lng-pts[0].lng)*t));}
    return out;
  }
  const P4 = [pts[0], ...pts, pts[pts.length-1]], out=[];
  for(let i=1;i<P4.length-2;i++){
    const p0=P4[i-1],p1=P4[i],p2=P4[i+1],p3=P4[i+2];
    for(let j=0;j<16;j++){ const t=j/16, t2=t*t, t3=t2*t;
      out.push(L.latLng(
        .5*((2*p1.lat)+(-p0.lat+p2.lat)*t+(2*p0.lat-5*p1.lat+4*p2.lat-p3.lat)*t2+(-p0.lat+3*p1.lat-3*p2.lat+p3.lat)*t3),
        .5*((2*p1.lng)+(-p0.lng+p2.lng)*t+(2*p0.lng-5*p1.lng+4*p2.lng-p3.lng)*t2+(-p0.lng+3*p1.lng-3*p2.lng+p3.lng)*t3)));
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function curvePts(a,b){ return smooth([a, ...(viaFor(a,b)||[]), b]); }

const roadCache = new Map();
let active = 0; const queue = [];
function slot(){
  return new Promise(res=>{ const run=()=>{active++;res(()=>{active--; const n=queue.shift(); if(n) n();});};
    if(active<3) run(); else queue.push(run); });
}
async function roadPath(leg){
  if(leg.mode === 'jr') return null;
  const via = viaFor(leg.from, leg.to) || [];
  const coords = [leg.from, ...via, leg.to].map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join(';');
  const profile = leg.mode === 'walk' ? 'foot' : 'driving';
  const key = profile+':'+coords;
  if(roadCache.has(key)) return roadCache.get(key);
  const release = await slot();
  try{
    const r = await fetch('https://router.project-osrm.org/route/v1/'+profile+'/'+coords+'?overview=full&geometries=geojson');
    if(!r.ok) throw 0;
    const j = await r.json();
    const line = j.routes && j.routes[0] && j.routes[0].geometry.coordinates.map(c=>L.latLng(c[1],c[0]));
    if(!line || line.length < 2) throw 0;
    roadCache.set(key, line);
    return line;
  }catch(e){ roadCache.set(key, null); return null; }
  finally{ release(); }
}

let cur = 0, token = 0, raf = null, vehMarker = null, lastPan = 0, autoPlay = true, autoTimer = null;

function render(i, animate){
  const day = DAYS[i]; const my = ++token;
  if(raf) cancelAnimationFrame(raf);
  ['past','route','veh','pins','card'].forEach(k=>layers[k].clearLayers());

  DAYS.slice(0,i).forEach(dd=>dd.legs.forEach(l=>{
    const pl = L.polyline(curvePts(l.from,l.to), {color:'#bdae99',weight:1.6,opacity:.55,dashArray:'2 6'})
      .addTo(layers.past);
    roadPath(l).then(real=>{ if(real && my===token) pl.setLatLngs(real); });
  }));

  const legs = day.legs.map(l=>{
    const pts = curvePts(l.from,l.to);
    const line = L.polyline(pts, {color:COL[l.mode], weight:3, opacity:animate?.2:.9,
      lineCap:'round', dashArray: l.mode==='drive' ? '7 7' : null}).addTo(layers.route);
    const rec = {l, pts, line};
    roadPath(l).then(real=>{ if(real && my===token){ rec.pts = real; line.setLatLngs(real); } });
    return rec;
  });
  day.legs.slice(1).forEach(l=>{
    L.marker(LL(l.from), {icon:L.divIcon({className:'', html:'<div class="xfer"></div>', iconSize:[0,0]}),
      interactive:false}).addTo(layers.route);
  });

  drawPins(day);


  const startLL = legs[0].pts[0];
  const dirLeg = day.legs[animate ? 0 : day.legs.length-1];
  setTimeout(()=>{ const a=map.latLngToContainerPoint(LL(dirLeg.from)), b=map.latLngToContainerPoint(LL(dirLeg.to));
                   applyHeading(b.x-a.x, b.y-a.y, true); }, 60);
  vehMarker = L.marker(animate ? startLL : legs[legs.length-1].pts.at(-1), {
    icon: vehIcon(day.legs[0].mode), interactive:false, zIndexOffset:-100 }).addTo(layers.veh);

  const bounds = L.latLngBounds([]);
  day.legs.forEach(l=>{bounds.extend(LL(l.from));bounds.extend(LL(l.to));});
  day.spots.forEach(s=>bounds.extend(LL(s.p)));
    const narrow = map.getSize().x < 640;
  map.flyToBounds(bounds, {paddingTopLeft: narrow?[46,80]:[120,150],
                           paddingBottomRight: narrow?[46,50]:[100,90],
                           maxZoom:12, duration:.9});

  document.getElementById('legday').textContent = 'Day ' + (i+1) + ' · ' + day.d;
  if(!animate){ document.getElementById('legtext').textContent = day.city; return; }

  const step = k => {
    if(my!==token) return;
    if(k>=legs.length){
      document.getElementById('legtext').textContent = day.city;
      if(autoPlay){
        clearTimeout(autoTimer);
        autoTimer = setTimeout(()=>{
          if(!autoPlay || my!==token) return;
          fadeOut().then(()=>{
            if(!autoPlay || my!==token) return;
            cur = (i+1) % DAYS.length;
            paintDays(); paintCards(); render(cur, true);
          });
        }, 2600);
      }
      return;
    }
    const leg = legs[k], l = leg.l, line = leg.line;
    line.setStyle({opacity:.95});
    vehMarker.setIcon(vehIcon(l.mode));
    hideSpotCard();
    document.getElementById('legtext').textContent = l.label;
    const pa = map.latLngToContainerPoint(LL(l.from)), pb = map.latLngToContainerPoint(LL(l.to));
    setTimeout(()=>applyHeading(pb.x-pa.x, pb.y-pa.y, true), 20);
    const legDist = LL(l.from).distanceTo(LL(l.to));
    if(legDist < 30){ step(k+1); return; }
    let preWait = 0;
    if(legDist < 2600){                                  // 市區內短程 → 拉近看清楚
      const mid = L.latLng((LL(l.from).lat+LL(l.to).lat)/2, (LL(l.from).lng+LL(l.to).lng)/2);
      map.flyTo(mid, legDist < 900 ? 16 : 15, {duration:.9});
      preWait = 1400;
    } else if(legDist < 16000){                          // 近郊中程（如旭川→旭山動物園）→ 貼近這一段
      map.flyToBounds(L.latLngBounds([LL(l.from), LL(l.to)]),
        {paddingTopLeft: narrow?[50,84]:[130,150], paddingBottomRight: narrow?[50,50]:[100,90],
         maxZoom:13.5, duration:1});
      preWait = 1400;
    } else if(map.getZoom() > 12.2){                     // 長程 → 先退回當日全貌
      map.flyToBounds(bounds, {paddingTopLeft: narrow?[46,80]:[120,150],
        paddingBottomRight: narrow?[46,50]:[100,90], maxZoom:12, duration:1.1});
      preWait = 1400;
    }
    const dur = Math.max(3200, Math.min(9000, legDist/16));
    const t0 = performance.now() + preWait; lastPan = t0;
    const tick = now => {
      if(my!==token) return;
      if(now < t0){ raf = requestAnimationFrame(tick); return; }
      const t = Math.min(1,(now-t0)/dur);
      const e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
      const pts = leg.pts;
      const idx = Math.min(pts.length-1, Math.round(e*(pts.length-1)));
      const here = pts[idx];
      vehMarker.setLatLng(here);
      if(now - lastPan > 260){
        lastPan = now;
        const sz = map.getSize();
        const p = map.latLngToContainerPoint(here);
        const m = { x: sz.x*0.26, y: sz.y*0.26 };
        if(p.x < m.x || p.x > sz.x-m.x || p.y < m.y || p.y > sz.y-m.y)
          map.panTo(here, {animate:true, duration:.7, easeLinearity:.35});
      }
      if(t<1){ raf = requestAnimationFrame(tick); return; }
      const sp = spotAt(day, l);
      if(sp) map.flyTo(LL(sp.p), Math.max(map.getZoom(), 14.5), {duration:1});
      const shown = sp
        ? new Promise(r=>setTimeout(r, 1050)).then(()=>showSpotCard(sp, day))
        : Promise.resolve();
      shown.then(()=>{ if(my===token) setTimeout(()=>step(k+1), sp ? 5400 : 900); });
    };
    raf = requestAnimationFrame(tick);
  };
  Promise.race([
    Promise.all([...day.legs.map(l=>roadPath(l)), prefetchPhotos(day)]),
    new Promise(r=>setTimeout(r, 9000))
  ]).then(()=>{ if(my!==token) return; fadeIn(); setTimeout(()=>{ if(my===token) step(0); }, 1200); });
}

let headAng = 0, headFlip = 1;
function spotAt(day, leg){
  return leg.spot ? day.spots.find(s=>s.n===leg.spot) : null;

function hideSpotCard(){
  const el = document.querySelector('.spotpop');
  document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
  if(!el){ layers.card.clearLayers(); return; }
  el.classList.add('out');

}
async function photoFor(name){
  if(OWN[name]) return OWN[name];
  const w = await wikiPhoto(name);
  return w && w.src;
}
function prefetchPhotos(day){
  return Promise.all(day.spots.map(async s=>{
    const src = await photoFor(s.n);
    if(!src) return;
    await new Promise(res=>{ const im = new Image(); im.onload=res; im.onerror=res; im.src=src; setTimeout(res,5000); });
  }));
}
async function showSpotCard(spot, day){
  hideSpotCard();
  const img = await photoFor(spot.n);
  if(img) await new Promise(res=>{ const im = new Image(); im.onload = res; im.onerror = res; im.src = img;
                                   setTimeout(res, 2500); });
  const flip = map.latLngToContainerPoint(LL(spot.p)).x > map.getSize().x * 0.55;
  const html = '<div class="spotpop'+(flip?' flip':'')+'">'
    + (img ? '<div class="ph" style="background-image:url(\''+img+'\')"></div>' : '')
    + '<div class="tx"><b>'+spot.n+'</b><span>'+spot.time+'　'+spot.act+'</span></div></div>';
  L.marker(LL(spot.p), {icon:L.divIcon({className:'', html, iconSize:[0,0]}),
    interactive:false, zIndexOffset:2000}).addTo(layers.card);
  const idx = day.spots.indexOf(spot);
  if(idx >= 0){
    const cards = document.querySelectorAll('#cards .card');
    document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
    if(cards[idx]) cards[idx].classList.add('active');
  }
}
function applyHeading(dx,dy,snap){
  const el = vehMarker && vehMarker.getElement() && vehMarker.getElement().querySelector('.core');
  if(!el) return;
  const len = Math.hypot(dx,dy);
  if(len < 0.6) return;
  if(Math.abs(dx) > 4) headFlip = dx < 0 ? -1 : 1;          // 只有明顯左右移動才翻面
  let target = Math.atan2(dy, Math.abs(dx)) * 180/Math.PI;
  target = Math.max(-20, Math.min(20, target)) * (headFlip < 0 ? -1 : 1);
  headAng = target;
  el.style.transform = 'rotate('+headAng.toFixed(1)+'deg) scaleX('+headFlip+')';
}
function vehIcon(mode){
  return L.divIcon({className:'', iconSize:[0,0],
    html:'<div class="veh"><div class="core">'+ICON[mode](40)+'</div></div>'});
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

/* pins with screen-space clustering */
function drawPins(day){
  layers.pins.clearLayers();
  const last = day.legs[day.legs.length-1];
  const destPt = map.latLngToContainerPoint(LL(last.to));
  const clusters=[];
  const list = day.spots.map((s,k)=>({s,k}));
  if(day.stay) list.push({s:{n:day.stay.n, time:day.stay.time, p:day.stay.p}, k:-1, stay:true});
  list.forEach(it=>{
    const pt = map.latLngToContainerPoint(LL(it.s.p));
    const hit = clusters.find(c=>c.pt.distanceTo(pt)<70);
    if(hit) hit.items.push(it); else clusters.push({pt, ll:LL(it.s.p), items:[it]});
  });
  const w = map.getSize().x;
  clusters.forEach(c=>{
    const flip = c.pt.x > w*0.62;
    const near = destPt && c.pt.distanceTo(destPt) < 46;
    const html = '<div class="pin '+day.mode+(flip?' flip':'')+(near?' far':'')+'"><span class="dot"></span><div class="labels">'
      + c.items.map(it=>'<b'+((it.stay||it.s.stay)?' class="stay"':'')+'><i>'+it.s.time+'</i>'+it.s.n+'</b>').join('') + '</div></div>';
    L.marker(c.ll, {icon:L.divIcon({className:'',html,iconSize:[0,0]}), interactive:false}).addTo(layers.pins);
  });
}

const wikiCache = new Map();
async function wikiPhoto(name){
  if(wikiCache.has(name)) return wikiCache.get(name);
  const titles = WIKI[name] || [];
  for(const t of titles){
    for(const lang of ['zh','ja']){
      try{
        const u = 'https://'+lang+'.wikipedia.org/w/api.php?action=query&format=json&origin=*'
          + '&prop=pageimages&piprop=thumbnail&pithumbsize=900&redirects=1&titles=' + encodeURIComponent(t);
        const r = await fetch(u); if(!r.ok) continue;
        const j = await r.json();
        const pages = j.query && j.query.pages || {};
        for(const k in pages){
          const th = pages[k].thumbnail;
          if(th && th.source){
            const out = {src:th.source, title:pages[k].title, lang};
            wikiCache.set(name, out); return out;
          }
        }
      }catch(e){}
    }
  }
  wikiCache.set(name, null); return null;
}
function fillPhotos(day, dayIdx){

      const slot = document.getElementById('d'+(dayIdx+1)+'s'+(k+1));

buildBase();
paintDays(); paintCards(); render(0, true);
